---
services:
  panelarr:
    image: ghcr.io/apoxx9/panelarr:latest
    container_name: panelarr
    environment:
      - PUID=1029
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume1/docker/panelarr:/config
      - /volume1/library/comix:/comics
      - /volume1/downloads:/downloads
    ports:
      - 8787:8787
    restart: unless-stopped
