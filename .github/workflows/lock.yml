name: 'Lock threads'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: '90'
          issue-lock-reason: 'resolved'
          pr-inactive-days: '365'
          pr-lock-reason: 'resolved'
